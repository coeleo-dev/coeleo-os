# Publishes site/ to GitHub Pages.
#
# The site is static: no build step, so the artifact is the site/ directory as-is.
# There is deliberately only ONE Pages workflow in this repository. Two workflows
# sharing the "pages" concurrency group would queue against each other and race for
# the same deployment.
#
# Note: this must upload site/, never the repository root. Uploading "." publishes
# README.md, kernel/ and userspace/ as the website.

name: Deploy static content to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
